<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>داشبرد سئو استیل رخ</title>
<meta name="claude:viewport-fit-sides" content="cover">
<style>
/* Layout: command-center — steel hero band with health index, tile launcher grid (radar tile spans 2), each tile opens a full module view with a module switcher strip */
:root{
  --bg:#edf1f5; --surface:#ffffff; --surface-2:#f3f6f9; --surface-3:#e6ecf2;
  --fg:#0f1c27; --muted:#5b6c7b; --line:#d9e1e8;
  --hero:#0b3954; --hero-2:#12577c; --on-hero:#ffffff; --on-hero-muted:#b9d3e4;
  --accent:#1597c4;
  --us:#1597c4; --c1:#e08a1e; --c2:#7b5cc4; --c3:#d0537a; --c4:#8a9ba8;
  --good:#1d9a55; --good-soft:#e1f4e8;
  --warn:#c97a10; --warn-soft:#fbeeda;
  --crit:#d24343; --crit-soft:#fae2e2;
  --shadow:0 1px 2px rgba(15,28,39,.06),0 6px 20px rgba(15,28,39,.06);
  --font:'Dana','Vazirmatn',system-ui,Tahoma,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#09121a; --surface:#101c27; --surface-2:#152433; --surface-3:#1b2d3e;
  --fg:#e5edf3; --muted:#8ea2b3; --line:#21364a;
  --hero:#0c2638; --hero-2:#123a55; --on-hero:#ffffff; --on-hero-muted:#9fbfd4;
  --accent:#3cc0e8;
  --us:#3cc0e8; --c1:#f0a640; --c2:#a58ae6; --c3:#e77a9c; --c4:#9fb0bd;
  --good:#3cc87a; --good-soft:#11301f;
  --warn:#eaa94e; --warn-soft:#372912;
  --crit:#ef6b6b; --crit-soft:#3a1b1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#09121a; --surface:#101c27; --surface-2:#152433; --surface-3:#1b2d3e;
  --fg:#e5edf3; --muted:#8ea2b3; --line:#21364a;
  --hero:#0c2638; --hero-2:#123a55; --on-hero:#ffffff; --on-hero-muted:#9fbfd4;
  --accent:#3cc0e8;
  --us:#3cc0e8; --c1:#f0a640; --c2:#a58ae6; --c3:#e77a9c; --c4:#9fb0bd;
  --good:#3cc87a; --good-soft:#11301f;
  --warn:#eaa94e; --warn-soft:#372912;
  --crit:#ef6b6b; --crit-soft:#3a1b1b;
  --shadow:0 1px 2px rgba(0,0,0,.3),0 8px 24px rgba(0,0,0,.25);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{background:var(--bg);color:var(--fg);font-family:var(--font);direction:rtl;line-height:1.7;margin:0;font-variant-numeric:tabular-nums;font-size:14px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--hero)}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));max-width:1240px;margin:0 auto}
button{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Top bar */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--hero);color:var(--on-hero);border-bottom:1px solid rgba(255,255,255,.08)}
.tb{display:flex;align-items:center;gap:12px;padding-block:10px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;cursor:pointer;background:none;border:0;padding:0;color:var(--on-hero)}
.logo{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,var(--accent),var(--hero-2));display:grid;place-items:center;flex:none}
.brand b{font-size:1rem;font-weight:800;letter-spacing:-.01em}
.brand span{font-size:.75rem;color:var(--on-hero-muted);font-weight:500}
.tb .sp{flex:1}
.pill{font-size:.75rem;color:var(--on-hero-muted);background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:3px 11px}
.themebtn{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);color:var(--on-hero);border-radius:8px;padding:4px 11px;font-size:.78rem;cursor:pointer}
.themebtn:hover{background:rgba(255,255,255,.16)}

/* Hero */
.hero{background:linear-gradient(160deg,var(--hero) 0%,var(--hero-2) 100%);color:var(--on-hero);position:relative;overflow:hidden}
.hero-in{display:grid;grid-template-columns:auto 1fr minmax(240px,300px);gap:36px;align-items:center;padding-block:36px 40px;position:relative;z-index:1}
.ring-box{position:relative;width:148px;height:148px;flex:none}
.ring-box .num{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring-box .num b{font-size:2.6rem;font-weight:800;line-height:1;display:block}
.ring-box .num small{font-size:.7rem;color:var(--on-hero-muted);display:block;margin-top:4px}
.hero h1{font-size:1.55rem;margin:0 0 6px;font-weight:800;text-wrap:balance;letter-spacing:-.015em}
.hero p{margin:0;color:var(--on-hero-muted);font-size:.9rem;max-width:58ch}
.hero-kpis{display:flex;gap:32px;flex-wrap:wrap;margin-top:22px}
.hk{min-width:0}
.hk .l{font-size:.7rem;color:var(--on-hero-muted)}
.hk .v{font-size:1.15rem;font-weight:800}
.hk .v em{font-style:normal;font-size:.72rem;font-weight:600;margin-inline-start:4px}
.hk .v em.up{color:#7ee2a6}.hk .v em.down{color:#ff9d9d}
.board{border-inline-start:1px solid rgba(255,255,255,.14);padding-inline-start:24px}
.board h3{margin:0 0 8px;font-size:.78rem;color:var(--on-hero-muted);font-weight:600;letter-spacing:.02em}
.brow{display:grid;grid-template-columns:18px 1fr 90px 30px;align-items:center;gap:8px;padding:4px 0;font-size:.82rem}
.brow .rk{color:var(--on-hero-muted);font-size:.72rem}
.brow.me{font-weight:800}
.brow .trk{height:6px;border-radius:4px;background:rgba(255,255,255,.12);overflow:hidden}
.brow .trk i{display:block;height:100%;border-radius:4px}
.brow .sc{text-align:left;font-weight:700}

/* Sample banner */
.sample{font-size:.76rem;color:var(--muted);margin-top:18px;display:flex;align-items:center;gap:8px}
.sample::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--warn);flex:none}

/* Tiles */
.sec-title{display:flex;align-items:baseline;gap:10px;margin:30px 0 16px;flex-wrap:wrap}
.sec-title h2{margin:0;font-size:1.05rem;font-weight:800}
.tiles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:20px;grid-auto-flow:dense}
.tile.big{grid-column:span 2;grid-row:span 2}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:22px;text-align:right;cursor:pointer;display:flex;flex-direction:column;gap:16px;min-width:0;transition:transform .18s ease,box-shadow .18s ease,border-color .18s ease;position:relative}
.tile:hover{transform:translateY(-3px);box-shadow:var(--shadow);border-color:var(--accent)}
.tile.wide{grid-column:span 2}
.t-head{display:flex;align-items:center;gap:10px}
.t-ico{width:34px;height:34px;border-radius:9px;background:var(--surface-3);display:grid;place-items:center;color:var(--accent);flex:none}
.t-name{font-weight:700;font-size:.95rem}
.t-go{margin-inline-start:auto;color:var(--muted);font-size:1.1rem;transition:transform .18s}
.tile:hover .t-go{transform:translateX(-4px);color:var(--accent)}
.t-stat{display:flex;align-items:flex-end;justify-content:space-between;gap:10px}
.t-big{font-size:1.9rem;font-weight:800;line-height:1;letter-spacing:-.02em}
.t-big small{font-size:.8rem;font-weight:600;color:var(--muted);margin-inline-start:4px}
.t-sub{font-size:.78rem;color:var(--muted)}
.t-foot{display:flex;gap:6px;flex-wrap:wrap;margin-top:auto}
.feed-mini{display:flex;flex-direction:column;gap:7px}
.fm{display:flex;gap:8px;align-items:center;font-size:.8rem;min-width:0}
.fm .who{font-weight:700;flex:none}
.fm .what{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.live{display:inline-flex;align-items:center;gap:6px;font-size:.72rem;font-weight:700;color:var(--crit)}
.live i{width:7px;height:7px;border-radius:50%;background:var(--crit);animation:pulse 1.6s infinite}
@keyframes pulse{0%{box-shadow:0 0 0 0 color-mix(in srgb,var(--crit) 60%,transparent)}70%{box-shadow:0 0 0 7px transparent}100%{box-shadow:0 0 0 0 transparent}}

/* chips */
.chip{display:inline-flex;align-items:center;gap:4px;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:700;white-space:nowrap}
.g{background:var(--good-soft);color:var(--good)} .w{background:var(--warn-soft);color:var(--warn)} .c{background:var(--crit-soft);color:var(--crit)} .n{background:var(--surface-3);color:var(--muted)}
.up{color:var(--good)} .down{color:var(--crit)}

/* Module view */
.mod-head{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin:20px 0 6px}
.back{background:var(--surface);border:1px solid var(--line);border-radius:9px;padding:6px 12px;cursor:pointer;font-size:.82rem;font-weight:600}
.back:hover{border-color:var(--accent);color:var(--accent)}
.mod-head h1{margin:0;font-size:1.35rem;font-weight:800;letter-spacing:-.01em}
.mod-desc{color:var(--muted);font-size:.86rem;margin:0 0 14px;max-width:80ch}
.switch{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:16px;scrollbar-width:thin}
.switch button{flex:none;background:var(--surface);border:1px solid var(--line);border-radius:999px;padding:5px 13px;font-size:.8rem;cursor:pointer;color:var(--muted);font-weight:600}
.switch button.on{background:var(--accent);border-color:var(--accent);color:#fff}
.switch button:hover:not(.on){color:var(--fg);border-color:var(--accent)}

.grid{display:grid;gap:20px}
#mod-body>*+*{margin-top:20px!important}
.card{padding:22px!important}
.card .hint{margin-bottom:16px!important}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g21{grid-template-columns:minmax(0,2fr) minmax(0,1fr)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:16px;min-width:0}
.card h3{margin:0 0 4px;font-size:.92rem;font-weight:700}
.card .hint{font-size:.76rem;color:var(--muted);margin:0 0 12px}
.stat{display:flex;flex-direction:column;gap:2px}
.stat .l{font-size:.76rem;color:var(--muted)}
.stat .v{font-size:1.6rem;font-weight:800;line-height:1.15}
.stat .d{font-size:.76rem;font-weight:600}

svg.chart{width:100%;height:auto;display:block;font-family:var(--font);direction:ltr}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:.76rem;color:var(--muted);margin-top:8px}
.legend button{background:none;border:0;padding:2px 4px;cursor:pointer;display:inline-flex;align-items:center;gap:6px;color:var(--muted);font-size:.76rem;border-radius:6px}
.legend button.off{opacity:.35}
.sw{width:12px;height:4px;border-radius:2px;display:inline-block}
.dot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:10px}
table{border-collapse:collapse;width:100%;font-size:.84rem;min-width:560px}
th,td{padding:9px 11px;text-align:right;white-space:nowrap}
thead th{background:var(--surface-2);color:var(--muted);font-weight:600;font-size:.76rem}
thead th[data-k]{cursor:pointer;user-select:none}
thead th[data-k]:hover{color:var(--fg)}
tbody tr{border-top:1px solid var(--line)}
tbody tr:hover{background:var(--surface-2)}
td.kw{font-weight:600;white-space:normal;min-width:150px}
tr.me td{background:color-mix(in srgb,var(--us) 8%,transparent)}
.rk{display:inline-flex;justify-content:center;min-width:30px;padding:2px 7px;border-radius:7px;font-weight:700;font-size:.8rem}
.rk.t{background:var(--good-soft);color:var(--good)}
.rk.m{background:var(--warn-soft);color:var(--warn)}
.rk.l{background:var(--crit-soft);color:var(--crit)}
.rk.x{background:var(--surface-3);color:var(--muted)}
.rk.us{box-shadow:inset 0 0 0 2px var(--us)}
.filters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.fbtn{background:var(--surface-2);border:1px solid var(--line);border-radius:999px;padding:3px 12px;font-size:.76rem;cursor:pointer;font-weight:600;color:var(--muted)}
.fbtn.on{background:var(--fg);color:var(--bg);border-color:var(--fg)}

/* stacked dist */
.dist{display:flex;flex-direction:column;gap:9px}
.drow{display:grid;grid-template-columns:86px 1fr;gap:10px;align-items:center;font-size:.8rem}
.drow b{font-weight:700}
.dbar{display:flex;height:20px;border-radius:6px;overflow:hidden;background:var(--surface-3)}
.dbar i{display:grid;place-items:center;font-style:normal;font-size:.68rem;font-weight:700;color:#fff;min-width:0}

/* bars */
.brs{display:flex;flex-direction:column;gap:7px}
.br{display:grid;grid-template-columns:86px 1fr 54px;gap:8px;align-items:center;font-size:.8rem}
.br .tr{height:12px;background:var(--surface-3);border-radius:5px;overflow:hidden}
.br .tr i{display:block;height:100%;border-radius:5px}
.br .nv{text-align:left;font-weight:700;color:var(--muted);font-size:.76rem}

/* radar feed */
.feed{display:flex;flex-direction:column}
.ev{display:grid;grid-template-columns:44px 1fr;gap:12px;padding:13px 0;border-top:1px solid var(--line)}
.ev:first-child{border-top:0}
.ev-ico{width:40px;height:40px;border-radius:11px;display:grid;place-items:center;font-weight:800;font-size:.7rem;color:#fff}
.ev-top{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.ev-top .who{font-weight:800}
.ev-top .date{color:var(--muted);font-size:.74rem;margin-inline-start:auto}
.ev-t{font-weight:600;margin-top:2px}
.ev-url{font-family:ui-monospace,Consolas,monospace;font-size:.74rem;color:var(--muted);direction:ltr;text-align:right;overflow-wrap:anywhere}
.ev-act{margin-top:7px;background:var(--surface-2);border-radius:8px;padding:7px 11px;font-size:.8rem;border-inline-start:3px solid var(--accent)}
.ev-act b{color:var(--accent)}
.compcards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:14px}
.cc{background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:12px 14px;cursor:pointer;text-align:right;min-width:0}
.cc.on{border-color:var(--accent);box-shadow:inset 0 0 0 1px var(--accent)}
.cc .nm{display:flex;align-items:center;gap:7px;font-weight:700;font-size:.86rem}
.cc .cnt{font-size:1.5rem;font-weight:800;margin-top:4px;line-height:1.1}
.cc .cnt small{font-size:.72rem;color:var(--muted);font-weight:600}
.weeks{display:flex;gap:3px;align-items:flex-end;height:26px;margin-top:6px}
.weeks i{flex:1;border-radius:2px;min-height:3px}

/* heatmap */
.hm{border-collapse:separate;border-spacing:4px;min-width:560px}
.hm th{background:none;font-size:.76rem;color:var(--muted);font-weight:600;padding:4px 6px}
.hm td{border-radius:8px;text-align:center;font-weight:700;font-size:.82rem;padding:10px 6px}
.hm td.kw{text-align:right;background:none;font-size:.84rem}
.hm tr{border:0}
.hm tbody tr:hover{background:none}

/* checklist */
.chk{display:flex;flex-direction:column;gap:9px}
.ci{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:10px;background:var(--surface-2)}
.ci .st{width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:.75rem;font-weight:800;flex:none}
.ci .tt{font-weight:700;font-size:.85rem}
.ci .dd{font-size:.78rem;color:var(--muted)}

footer{margin:44px 0 30px;color:var(--muted);font-size:.76rem;text-align:center;border-top:1px solid var(--line);padding-top:16px}

.fade{animation:fadein .35s ease both}
@keyframes fadein{from{opacity:.0;transform:translateY(6px)}to{opacity:1;transform:none}}

@media (max-width:1040px){
  .tiles{grid-template-columns:repeat(2,minmax(0,1fr))}
  .hero-in{grid-template-columns:auto 1fr}
  .board{grid-column:1/-1}
  .compcards{grid-template-columns:repeat(2,minmax(0,1fr))}
  .g3{grid-template-columns:1fr}
}
@media (max-width:760px){
  .g2,.g21{grid-template-columns:1fr}
}
@media (max-width:560px){
  .tiles{grid-template-columns:1fr}
  .tile.wide,.tile.big{grid-column:auto;grid-row:auto}
  .hero-in{grid-template-columns:1fr;justify-items:start}
  .hero h1{font-size:1.25rem}
  .compcards{grid-template-columns:1fr 1fr}
  .tb .pill{display:none}
}
</style>

<div class="topbar">
  <div class="wrap tb">
    <button class="brand" id="home-btn" type="button" aria-label="بازگشت به صفحه اصلی">
      <span class="logo"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round"><path d="M4 18l5-6 4 3 7-9"/></svg></span>
      <span style="display:flex;flex-direction:column;align-items:flex-start;line-height:1.25"><b>SEO Intelligence</b><span>استیل رخ</span></span>
    </button>
    <div class="sp"></div>
    <span class="pill" id="snapshot-date">نسخهٔ جلسه</span>
    <button class="themebtn" id="themebtn" type="button">تغییر تم</button>
  </div>
</div>

<div id="home">
  <section class="hero">
    <div class="wrap hero-in" id="hero"></div>
  </section>
  <main class="wrap">
    <div class="sample" id="sample-note">داده‌ها نمونه و فرضی هستند</div>
    <div class="sec-title"><h2>ماژول‌ها</h2></div>
    <div class="tiles" id="tiles"></div>
    <footer>داشبرد SEO Intelligence استیل رخ · پایش رتبه، تحرکات رقبا، گپ کلمات و لینک، و سلامت فنی</footer>
  </main>
</div>

<div id="module" hidden>
  <main class="wrap">
    <div class="mod-head">
      <button class="back" id="back" type="button">→ همه ماژول‌ها</button>
      <h1 id="mod-title"></h1>
    </div>
    <p class="mod-desc" id="mod-desc"></p>
    <div class="switch" id="switch"></div>
    <div id="mod-body"></div>

/* competitors.json کنار همین صفحه، خروجی scripts/screaming_frog.py از Mode > Compare.
   عنوان فارسی و اقدام پیشنهادی هر تغییر دستی نوشته می‌شود (فایل notes.json)؛
   تغییری که اقدام ندارد، بدون اقدام نمایش داده می‌شود، نه با جملهٔ ساختگی. */
function applyCompetitorsJson(j){
  if(!j||!j.competitors||!Object.keys(j.competitors).length)return false;
  const m=j.meta||{};
  const T={new_page:'page',removed_page:'gone',title_changed:'title',meta_changed:'meta',h1_changed:'h1',schema_added:'schema'};
  const ev=[],comp={},rows={};
  Object.keys(j.competitors).forEach(cid=>{
    const c=j.competitors[cid]||{},k=c.counts||{},ch=Array.isArray(c.changes)?c.changes:[];
    comp[cid]={added:k.new_page||0,removed:k.removed_page||0,title:k.title_changed||0,meta:k.meta_changed||0,
      h1:k.h1_changed||0,schema:k.schema_added||0,src:c.counts_source==='compare_overview'?'overview':'rows'};
    rows[cid]=ch.length;
    ch.forEach(x=>{
      ev.push({who:cid,type:T[x.type]||'page',date:shortDate(x.date),
        days:(typeof x.days==='number'?x.days:999),impact:x.impact==='high'?'high':(x.impact||''),
        t:esc(x.title||'تغییر ثبت‌شده'),url:esc(x.url||''),act:esc(x.act||''),
        old:esc(x.old||''),nw:esc(x.new||'')});
    });
  });
  ev.sort((a,b)=>a.days-b.days);
  events=ev;sfCompare=comp;weekly={};
  RMETA={is_sample:!!m.is_sample,source:esc(m.source||'Screaming Frog Compare'),date:esc(m.date||''),
    notes:(Array.isArray(m.notes)?m.notes:[]).map(esc),rows:rows};
  return true;
}

function health(){
  const rows=ACTORS.filter(a=>backlinks[a.id]&&avgRankHist[a.id]);
  if(!rows.length)return [];
  const maxSov=Math.max(...rows.map(a=>SOV[a.id]),1),maxDr=Math.max(...rows.map(a=>backlinks[a.id].dr),1);
  return rows.map(a=>{const t=technical[a.id]||{};
    const v=SOV[a.id]/maxSov*40+backlinks[a.id].dr/maxDr*25+cwvGood(a.id)*20+((t.schema?1:0)+(t.mob?1:0))/2*15;
    return {id:a.id,score:Math.round(v)};}).sort((x,y)=>y.score-x.score);
}

/* ---------- SVG charts ---------- */
function spark(vals,color,invert){
  const W=130,H=36,p=3,mn=Math.min(...vals),mx=Math.max(...vals),rg=(mx-mn)||1,n=vals.length;
  const pts=vals.map((v,i)=>{const x=W-p-i*(W-2*p)/(n-1);let y=(v-mn)/rg;if(!invert)y=1-y;return [x,p+y*(H-2*p)];});
  const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
  const last=pts[pts.length-1];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="width:130px" aria-hidden="true">
    <path d="${d} L${last[0]} ${H} L${pts[0][0]} ${H} Z" fill="${color}" fill-opacity=".14"/>
    <path d="${d}" fill="none" stroke="${color}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    <circle cx="${last[0]}" cy="${last[1]}" r="3" fill="${color}"/></svg>`;
}
function niceTicks(mn,mx,n=5){const out=[];for(let i=0;i<n;i++)out.push(mn+(mx-mn)*i/(n-1));return out;}
function lineChart({series,labels,invert=false,min,max,fmt=v=>fad(v,1),H=270}){
  const W=700,pl=22,pr=46,pt=16,pb=34,n=labels.length;
  const x=i=>W-pr-i*(W-pl-pr)/(n-1);
  const y=v=>invert?pt+(v-min)/(max-min)*(H-pt-pb):H-pb-(v-min)/(max-min)*(H-pt-pb);
  let g='';
  niceTicks(min,max).forEach(t=>{g+=`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-dasharray="3 4"/>
    <text x="${W-pr+8}" y="${y(t)+4}" font-size="11" fill="var(--muted)" text-anchor="start">${fmt(t)}</text>`;});
  labels.forEach((l,i)=>{g+=`<text x="${x(i)}" y="${H-10}" font-size="11" fill="var(--muted)" text-anchor="middle">${l}</text>`;});
  let s='';
  series.filter(se=>!se.hidden).forEach(se=>{
    const pts=se.values.map((v,i)=>[x(i),y(v)]);
    const d=pts.map((q,i)=>(i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1)).join(' ');
    if(se.bold){const base=invert?pt:H-pb;s+=`<path d="${d} L${pts[n-1][0]} ${base} L${pts[0][0]} ${base} Z" fill="${se.color}" fill-opacity=".1"/>`;}
    s+=`<path d="${d}" fill="none" stroke="${se.color}" stroke-width="${se.bold?3:1.8}" stroke-linecap="round" stroke-linejoin="round" ${se.bold?'':'opacity=".85"'}/>`;
    pts.forEach((q,i)=>{s+=`<circle cx="${q[0]}" cy="${q[1]}" r="${i===n-1?(se.bold?5:3.5):2.2}" fill="${i===n-1?se.color:'var(--surface)'}" stroke="${se.color}" stroke-width="1.6"><title>${se.name} · ${labels[i]}: ${fmt(se.values[i])}</title></circle>`;});
    const lp=pts[n-1];
    if(se.bold)s+=`<text x="${lp[0]-10}" y="${lp[1]-9}" font-size="12" font-weight="800" fill="${se.color}" text-anchor="end">${fmt(se.values[n-1])}</text>`;
  });
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" role="img">${g}${s}</svg>`;
}
function legend(id,series){
  return `<div class="legend" id="${id}">${series.map((s,i)=>`<button type="button" data-i="${i}" class="${s.hidden?'off':''}"><span class="sw" style="background:${s.color}"></span>${s.name}</button>`).join('')}</div>`;
}
function bindLegend(id,series,redraw){
  document.querySelectorAll(`#${id} button`).forEach(b=>b.onclick=()=>{const s=series[+b.dataset.i];s.hidden=!s.hidden;redraw();});
}
function ring(pct,size=148,stroke=12,color='var(--accent)',track='rgba(255,255,255,.14)'){
  const r=(size-stroke)/2,c=2*Math.PI*r,o=c*(1-pct/100);
  return `<svg width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" aria-hidden="true" style="transform:rotate(-90deg)">
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${track}" stroke-width="${stroke}"/>
    <circle cx="${size/2}" cy="${size/2}" r="${r}" fill="none" stroke="${color}" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${c}" stroke-dashoffset="${o}"/></svg>`;
}
function radarChart(axes,sets){
  const W=420,H=360,cx=210,cy=180,R=125,n=axes.length;
  const pt=(i,v)=>{const a=-Math.PI/2+i*2*Math.PI/n;return [cx+Math.cos(a)*R*v/100,cy+Math.sin(a)*R*v/100];};
  let g='';
  [25,50,75,100].forEach(l=>{g+=`<polygon points="${axes.map((_,i)=>pt(i,l).join(',')).join(' ')}" fill="none" stroke="var(--line)"/>`;});
  axes.forEach((ax,i)=>{const [x2,y2]=pt(i,100),[lx,ly]=pt(i,120);
    g+=`<line x1="${cx}" y1="${cy}" x2="${x2}" y2="${y2}" stroke="var(--line)"/>
    <text x="${lx}" y="${ly+4}" font-size="12" fill="var(--muted)" text-anchor="middle" font-weight="600">${ax}</text>`;});
  sets.forEach(s=>{g+=`<polygon points="${s.v.map((v,i)=>pt(i,v).join(',')).join(' ')}" fill="${s.color}" fill-opacity="${s.bold?.22:.1}" stroke="${s.color}" stroke-width="${s.bold?2.6:1.8}"/>`;
    s.v.forEach((v,i)=>{const [x,y]=pt(i,v);g+=`<circle cx="${x}" cy="${y}" r="3" fill="${s.color}"><title>${s.name} · ${axes[i]}: ${fa(Math.round(v))}</title></circle>`;});});
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" style="max-width:440px;margin:auto">${g}</svg>`;
}

  <div class="card"><h3>فرصت‌های لینک</h3><p class="hint">سایت‌هایی که به چند رقیب لینک داده‌اند ولی به ما نه</p>
    <div class="tw"><table><thead><tr><th>سایت</th><th>نوع</th><th>DR</th>${BL.filter(a=>a.id!=='us').map(c=>`<th>${c.name}</th>`).join('')}<th>استیل رخ</th></tr></thead>
    <tbody>${intersect.map(s=>`<tr><td class="kw">${s.site}</td><td><span class="chip n">${s.type}</span></td><td>${fa(s.dr)}</td>${BL.filter(a=>a.id!=='us').map(c=>`<td>${s.has.includes(c.id)?`<span class="rk t">✓</span>`:'<span style="color:var(--muted)">—</span>'}</td>`).join('')}<td><span class="rk l">✕</span></td></tr>`).join('')}</tbody></table></div></div>`;
  const draw=()=>{document.getElementById('bchart').innerHTML=lineChart({series,labels:MONTHS,min:0,max:600,fmt:v=>fa(Math.round(v))});};

};

R.technical=el=>{
  let ff='phone',met='lcp';

  /* این ماژول همهٔ دامنه‌های config/sites.json را نشان می‌دهد، نه فقط چهار رقیب اصلی داشبرد:
     سلامت فنی را برای هر دامنه‌ای که CrUX داده داشته باشد می‌شود گرفت و دور ریختنش حیف است.
     پس ACTORS اینجا عمداً فهرست بزرگ‌ترِ TECH را می‌پوشاند و بقیهٔ ماژول‌ها دست نمی‌خورند.
     رنگ و نام چهار رقیب اصلی از خود داشبرد می‌آید، بقیه از پالت زیر. */
  const PAL=['#6f8fa6','#a67f6f','#6fa686','#a66f9b','#8f8f5e','#5e7f8f','#9b6fa6'];
  const ACTORS=Object.entries(TECH.sites).map(([id,s],i)=>{const known=A(id);
    return {id,name:(known&&known.name)||s.label||id,color:(known&&known.color)||PAL[i%PAL.length],extra:s.extra||{}};});
  const usSite=ACTORS.find(a=>a.id==='us')||{extra:{}};
  const M5=['lcp','inp','cls','fcp','ttfb'];
  const SEG=[['var(--good)','خوب'],['var(--warn)','نیاز به بهبود'],['var(--crit)','ضعیف']];
  const SUB=[['ttfb','تا اولین بایت','var(--c4)'],['delay','تأخیر شروع بارگذاری','var(--c2)'],['dur','مدت بارگذاری تصویر','var(--accent)'],['render','تأخیر رندر','var(--c1)']];
  const NAV=[['navigate','ورود عادی','var(--accent)'],['navigate_cache','ورود با کش HTTP','var(--us)'],['back_forward_cache','بازگشت از bfcache','var(--good)'],['back_forward','بازگشت بدون کش','var(--warn)'],['reload','بارگذاری مجدد','var(--c3)'],['restore','بازیابی تب','var(--c2)'],['prerender','پیش‌رندر','var(--c1)']];
  const nd='<span style="color:var(--muted)">—</span>';
  const stack=(parts)=>`<div class="dbar">${parts.filter(p=>p.v>0).map(p=>`<i style="flex:${p.v};background:${p.c}" title="${p.t}">${p.lab}</i>`).join('')}</div>`;
  const meta=TECH.meta||{},per=meta.period||{};
  const faDate=s=>s?toFa(s.replace(/-/g,'/')):'؟';
  el.innerHTML=`
  <div class="card" style="padding:14px 18px!important">
    <div style="display:flex;align-items:center;gap:14px;flex-wrap:wrap">
      <div class="filters" id="ff" style="margin:0"></div>
      <span style="font-size:.76rem;color:var(--muted)">دادهٔ میدانی CrUX · تجربهٔ واقعی کاربران Chrome · صدک ۷۵ · دورهٔ ${faDate(per.first)} تا ${faDate(per.last)}</span>
      ${meta.is_sample?'<span class="chip w">دادهٔ نمونه</span>':'<span class="chip g">دادهٔ واقعی</span>'}
    </div>
    ${(meta.notes&&meta.notes.length)?`<p class="hint" style="margin:10px 0 0!important">${meta.notes.map(n=>'· '+n).join('<br>')}</p>`:''}
  </div>
  <div class="card"><h3>ارزیابی Core Web Vitals</h3><p class="hint">قبول یعنی هر سه شاخص LCP و INP و CLS در محدودهٔ خوب باشند. سایتی که ترافیک کافی نداشته باشد در CrUX رکورد ندارد.</p><div class="tw"><table id="cwv"></table></div></div>
  <div class="card"><h3>توزیع تجربهٔ کاربران</h3><p class="hint">سهم واقعی بازدیدها در هر محدوده. صدک ۷۵ یک عدد است؛ این نوار نشان می‌دهد پشت آن عدد چه خبر است.</p>
    <div class="filters" id="mf"></div><div class="dist" id="mdist"></div>
    <div class="legend">${SEG.map(s=>`<span><span class="sw" style="background:${s[0]}"></span>${s[1]}</span>`).join('')}<span id="mth"></span></div></div>
  <div class="grid g2">
    <div class="card"><h3>اجزای LCP</h3><p class="hint">مراحل رسیدن به بزرگ‌ترین تصویر صفحه. هر جزء صدک ۷۵ خودش است، پس جمعشان دقیقاً برابر LCP نمی‌شود؛ نسبت‌ها را ببین، نه جمع را.</p><div class="dist" id="lsub"></div>
      <div class="legend">${SUB.map(s=>`<span><span class="sw" style="background:${s[2]}"></span>${s[1]}</span>`).join('')}</div>
      <p class="hint" id="ltype" style="margin:14px 0 0!important"></p></div>
    <div class="card"><h3>کیفیت شبکهٔ کاربران</h3><p class="hint">RTT زمان رفت‌و‌برگشت شبکهٔ کاربران است و به سرعت سایت ما ربطی ندارد؛ برای تفسیر TTFB لازم است.</p><div class="brs" id="rtt"></div></div>
  </div>
  <div class="grid g2">
    <div class="card"><h3>نوع ناوبری</h3><p class="hint">سهم بیشتر bfcache و پیش‌رندر یعنی بازگشت‌های فوری‌تر. هفت نوع ناوبری CrUX، مجموعشان تقریباً ۱۰۰ درصد.</p><div class="dist" id="nav"></div>
      <div class="legend">${NAV.map(n=>`<span><span class="sw" style="background:${n[2]}"></span>${n[1]}</span>`).join('')}</div></div>
    <div class="card"><h3>زمان‌های آزمایشگاهی</h3><p class="hint">یک اجرای Lighthouse روی صفحهٔ اصلی، نه تجربهٔ کاربران واقعی. CrUX این سه زمان را ندارد. با اعداد جدول بالا مقایسه نکن.</p><div class="tw"><table id="lab" style="min-width:420px"></table></div></div>
  </div>
  <div class="card"><h3>صفحات ایندکس‌شده</h3><p class="hint">ما از Search Console؛ رقبا از ابزار پولی. این عدد دستی در config/manual-overrides.json پر می‌شود و از CrUX نمی‌آید.</p>
    <div class="brs" id="idx"></div>
    <p class="hint" id="idxnote" style="margin:14px 0 0!important"></p></div>
  <div class="card"><h3>مشکلات فنی ما</h3><p class="hint">به ترتیب اولویت</p><div class="chk" id="iss"></div></div>`;

  const draw=()=>{
    document.getElementById('ff').innerHTML=[['phone','موبایل'],['desktop','دسکتاپ']].map(([k,l])=>`<button type="button" class="fbtn ${ff===k?'on':''}" data-f="${k}">${l}</button>`).join('');
    document.querySelectorAll('#ff button').forEach(b=>b.onclick=()=>{ff=b.dataset.f;draw();});
    const D=Object.fromEntries(ACTORS.map(a=>[a.id,TF(a.id,ff)]));
    const reason=id=>{const s=TECH.sites[id]||{};
      if(s.missing_origin)return 'دامنه وارد نشده';
      return ((s[ff]||{}).reason)||'بدون دادهٔ CrUX';};

    /* ترتیب هر کارت بر اساس خوب بودن همان شاخص است، نه جای ثابت سایت در فهرست.
       score عددی می‌دهد که کوچک‌تر یعنی بهتر، یا null برای سایت بی‌داده که آخر می‌رود.
       ردیف ما از رنگ و پررنگی پیدا می‌شود، نه از جایگاهش. */
    const byBest=score=>ACTORS.slice().sort((x,y)=>{const a=score(x),b=score(y);
      if(a===null&&b===null)return 0;if(a===null)return 1;if(b===null)return -1;return a-b;});

    /* Core Web Vitals: اول قبول‌شده‌ها، بعد به ترتیب LCP. دادهٔ ناقص بعد از کامل‌ها. */
    const cwvScore=a=>{const d=D[a.id];if(!d)return null;
      const ks=['lcp','inp','cls'].filter(k=>d.p75[k]!=null);
      const good=ks.filter(k=>d.p75[k]<=TH[k].g).length;
      return (ks.length<3?1e9:0)+(3-good)*1e6+(d.p75.lcp!=null?d.p75.lcp:1e5);};
    // CWV table
    document.getElementById('cwv').innerHTML=`<thead><tr><th>سایت</th>${M5.map(k=>`<th title="${TH[k].fa}">${TH[k].n}</th>`).join('')}<th>نتیجه</th></tr></thead>
      <tbody>${byBest(cwvScore).map(a=>{const d=D[a.id];
        if(!d)return `<tr class="${a.id==='us'?'me':''}"><td class="kw"><span class="dot" style="background:${a.color}"></span> ${a.name}</td><td colspan="${M5.length}" style="color:var(--muted)">${reason(a.id)}</td><td><span class="chip n">—</span></td></tr>`;
        const pass=cwvPass(a.id,ff);
        return `<tr class="${a.id==='us'?'me':''}"><td class="kw"><span class="dot" style="background:${a.color}"></span> ${a.name}</td>${M5.map(k=>`<td>${d.p75[k]==null?nd:`<span class="rk ${mCls(k,d.p75[k])}">${fmtM(k,d.p75[k])}</span>`}</td>`).join('')}<td><span class="chip ${pass===null?'n':pass?'g':'c'}">${pass===null?'ناقص':pass?'قبول':'رد'}</span></td></tr>`;}).join('')}</tbody>`;
    // distribution
    document.getElementById('mf').innerHTML=M5.map(k=>`<button type="button" class="fbtn ${met===k?'on':''}" data-m="${k}">${TH[k].n}</button>`).join('');
    document.querySelectorAll('#mf button').forEach(b=>b.onclick=()=>{met=b.dataset.m;draw();});
    const distScore=a=>{const d=D[a.id];return (d&&d.dist[met]&&d.p75[met]!=null)?d.p75[met]:null;};
    document.getElementById('mdist').innerHTML=byBest(distScore).map(a=>{const d=D[a.id],ds=d&&d.dist[met];
      if(!ds)return `<div class="drow" style="grid-template-columns:86px 1fr 64px"><b>${a.name}</b><span class="hint" style="margin:0!important">${d?'این شاخص برای این سایت گزارش نشده':reason(a.id)}</span><span></span></div>`;
      return `<div class="drow" style="grid-template-columns:86px 1fr 64px"><b>${a.name}</b>${stack(ds.map((v,i)=>({v,c:SEG[i][0],t:SEG[i][1]+': '+v+'٪',lab:v>=8?fad(v,0)+'٪':''})))}<span style="font-size:.76rem;font-weight:700;text-align:left">${fmtM(met,d.p75[met])}</span></div>`;}).join('');
    const t=TH[met];
    document.getElementById('mth').innerHTML=`· ${t.fa} · خوب تا ${fmtM(met,t.g)}، ضعیف از ${fmtM(met,t.p)}`;
    // LCP subparts — مستقیم از CrUX
    const withParts=ACTORS.filter(a=>D[a.id]&&Object.keys(D[a.id].parts||{}).length);
    const maxSum=Math.max(1,...withParts.map(a=>SUB.reduce((s,x)=>s+(D[a.id].parts[x[0]]||0),0)));
    const partScore=a=>{const d=D[a.id],p=d&&d.parts;
      return (p&&Object.keys(p).length)?SUB.reduce((t,x)=>t+(p[x[0]]||0),0):null;};
    document.getElementById('lsub').innerHTML=byBest(partScore).map(a=>{const d=D[a.id],p=d&&d.parts;
      if(!p||!Object.keys(p).length)return `<div class="drow" style="grid-template-columns:86px 1fr"><b>${a.name}</b><span class="hint" style="margin:0!important">${d?'عنصر LCP این سایت تصویر نیست یا دادهٔ کافی ندارد':reason(a.id)}</span></div>`;
      const total=SUB.reduce((s,x)=>s+(p[x[0]]||0),0);
      return `<div class="drow" style="grid-template-columns:86px 1fr"><b>${a.name}</b><div style="width:${Math.max(12,total/maxSum*100)}%">${stack(SUB.map(x=>({v:p[x[0]]||0,c:x[2],t:x[1]+': '+(p[x[0]]||0)+' ms',lab:''})))}</div></div>`;}).join('');
    const imgs=ACTORS.filter(a=>D[a.id]&&D[a.id].lcp_image!=null).sort((x,y)=>D[y.id].lcp_image-D[x.id].lcp_image);
    document.getElementById('ltype').innerHTML=imgs.length?`عنصر LCP تصویر است در: ${imgs.map(a=>`${a.name} ${fad(D[a.id].lcp_image,0)}٪`).join(' · ')}`:'دادهٔ نوع عنصر LCP برای هیچ سایتی گزارش نشده است.';
    // RTT
    const rttRows=ACTORS.filter(a=>D[a.id]&&D[a.id].p75.rtt!=null);
    const rttMax=Math.max(1,...rttRows.map(a=>D[a.id].p75.rtt));
    document.getElementById('rtt').innerHTML=rttRows.length?rttRows.slice().sort((x,y)=>D[x.id].p75.rtt-D[y.id].p75.rtt).map(a=>`<div class="br"><span style="font-weight:${a.id==='us'?800:500}">${a.name}</span><span class="tr"><i style="width:${D[a.id].p75.rtt/rttMax*100}%;background:${a.color}"></i></span><span class="nv">${fa(D[a.id].p75.rtt)} ms</span></div>`).join(''):'<p class="hint" style="margin:0!important">RTT برای هیچ سایتی گزارش نشده است.</p>';
    // nav types — هفت نوع CrUX
    const navScore=a=>{const d=D[a.id],n=d&&d.nav;
      return n?-((n.navigate_cache||0)+(n.back_forward_cache||0)+(n.prerender||0)):null;};
    document.getElementById('nav').innerHTML=byBest(navScore).map(a=>{const d=D[a.id],n=d&&d.nav;
      if(!n)return `<div class="drow"><b>${a.name}</b><span class="hint" style="margin:0!important">${d?'نوع ناوبری برای این سایت گزارش نشده':reason(a.id)}</span></div>`;
      return `<div class="drow"><b>${a.name}</b>${stack(NAV.map(x=>({v:n[x[0]]||0,c:x[2],t:x[1]+': '+(n[x[0]]||0)+'٪',lab:(n[x[0]]||0)>=9?fad(n[x[0]],0)+'٪':''})))}</div>`;}).join('');
    // زمان‌های آزمایشگاهی
    const LABK=[['fp','First Paint'],['dcl','DOMContentLoaded'],['onload','Onload']];
    document.getElementById('lab').innerHTML=`<thead><tr><th>سایت</th><th>امتیاز عملکرد</th>${LABK.map(l=>`<th>${l[1]}</th>`).join('')}</tr></thead>
      <tbody>${byBest(a=>{const l=TLAB(a.id,ff);return (l&&l.score!=null)?-l.score:null;}).map(a=>{const lab=TLAB(a.id,ff);
        if(!lab)return `<tr class="${a.id==='us'?'me':''}"><td class="kw">${a.name}</td><td colspan="4" style="color:var(--muted)">PageSpeed برای این سایت اجرا نشده</td></tr>`;
        const sc=lab.score;
        return `<tr class="${a.id==='us'?'me':''}"><td class="kw">${a.name}</td><td>${sc==null?nd:`<span class="rk ${sc>=90?'t':sc>=50?'m':'l'}">${fa(sc)}</span>`}</td>${LABK.map(l=>`<td>${lab[l[0]]==null?nd:fmtM(l[0],lab[l[0]])}</td>`).join('')}</tr>`;}).join('')}</tbody>`;
    // صفحات ایندکس‌شده
    const idxOf=a=>(a.extra.idx>0?a.extra.idx:0);
    const idxRows=ACTORS.filter(a=>idxOf(a)>0);
    const idxMax=Math.max(1,...idxRows.map(idxOf));
    document.getElementById('idx').innerHTML=idxRows.length?idxRows.slice().sort((x,y)=>idxOf(y)-idxOf(x)).map(a=>`<div class="br"><span style="font-weight:${a.id==='us'?800:500}">${a.name}</span><span class="tr"><i style="width:${idxOf(a)/idxMax*100}%;background:${a.color}"></i></span><span class="nv">${fa(idxOf(a))}</span></div>`).join(''):'<p class="hint" style="margin:0!important">عدد ایندکس هنوز وارد نشده است.</p>';
    const missingIdx=ACTORS.filter(a=>idxOf(a)===0);
    document.getElementById('idxnote').innerHTML=[idxOf(usSite)>0?`ایندکس ما در ۶ ماه از ${fa(idxHist[0])} به ${fa(idxHist[5])} صفحه رسیده است.`:'',missingIdx.length?`بدون عدد ایندکس: ${missingIdx.map(a=>a.name).join('، ')}`:''].filter(Boolean).join(' · ');
    // issues
    const us=D.us,iss=[];
    if(!us){
      iss.push(['c','دادهٔ CrUX برای سایت ما نیست',`${reason('us')} — بدون این داده نمی‌شود گفت کاربران واقعی چه تجربه‌ای دارند.`]);
    }else{
      if(usSite.extra.schema==='no'){
        const withSchema=ACTORS.filter(a=>a.id!=='us'&&a.extra.schema==='yes').length;
        iss.push(['c','داده‌های ساختاریافته نداریم',withSchema?`${fa(withSchema)} رقیب Product و FAQ Schema دارند. برای صفحات محصول، دسته و مقالات اضافه شود.`:'برای صفحات محصول، دسته و مقالات اضافه شود. وضعیت رقبا هنوز بررسی نشده است.']);
      }
      M5.forEach(k=>{const v=us.p75[k];
        if(v==null||v<=TH[k].g)return;
        const better=ACTORS.filter(a=>a.id!=='us'&&D[a.id]&&D[a.id].p75[k]!=null&&D[a.id].p75[k]<v).sort((x,y)=>D[x.id].p75[k]-D[y.id].p75[k])[0];
        const poor=v>TH[k].p;
        iss.push([poor?'c':'w',`${TH[k].n} ${poor?'ضعیف':'نیاز به بهبود'} است`,`${fmtM(k,v)} در برابر آستانهٔ خوب ${fmtM(k,TH[k].g)}`+(better?` · بهترین رقیب: ${better.name} با ${fmtM(k,D[better.id].p75[k])}`:'')+`. ${TIPS[k]}`]);});
      const opps=((TLAB('us',ff)||{}).opps)||[];
      opps.forEach(o=>iss.push(['w',o.t,`تا ${fa(o.ms)} میلی‌ثانیه صرفه‌جویی — از فهرست فرصت‌های Lighthouse (آزمایشگاهی).`]));
    }
    const usIdx=usSite.extra.idx>0?usSite.extra.idx:0;
    if(usIdx>0){
      const bigger=ACTORS.filter(a=>a.id!=='us'&&a.extra.idx>usIdx).sort((x,y)=>y.extra.idx-x.extra.idx)[0];
      if(bigger)iss.push(['w','صفحات ایندکس‌شده کم است',`${fa(usIdx)} صفحه در برابر ${fa(bigger.extra.idx)} صفحهٔ ${bigger.name}.`]);
    }
    document.getElementById('iss').innerHTML=iss.length?iss.map(i=>`<div class="ci"><span class="st ${i[0]}">!</span><div><div class="tt">${i[1]}</div><div class="dd">${i[2]}</div></div></div>`).join(''):'<p class="hint" style="margin:0!important">در این form factor مشکلی پیدا نشد.</p>';
  };
  draw();
};

/* crawl.json کنار همین صفحه، خروجی scripts/screaming_frog.py از Issues Overview و
   Crawl Overview. هر مقداری که در فایل نباشد خالی می‌ماند و کارتش «—» می‌خورد؛
   نبودن داده با صفر بودن یکی نیست. */
function applyCrawlJson(j){
  if(!j||!Array.isArray(j.issues)||!j.issues.length)return false;
  const m=j.meta||{},ov=j.overview||{},st=ov.status||{},ix=ov.index||{},dp=ov.depth||{};
  const H=(Array.isArray(j.history)?j.history:[]).slice(-6);
  const SC=[['۲xx','2xx','var(--good)'],['۳xx','3xx','var(--warn)'],['۴xx','4xx','var(--crit)'],['۵xx','5xx','var(--c3)']];
  const IX=[['قابل ایندکس','indexable','var(--good)'],['Canonical به صفحهٔ دیگر','canonicalised','var(--accent)'],['noindex','noindex','var(--c2)'],['بقیه','other','var(--c4)']];
  const DP=[['۱','1'],['۲','2'],['۳','3'],['۴','4'],['۵+','5_plus']];
  const n=v=>typeof v==='number'?v:null;
  crawl={
    urls:n(ov.total_urls),indexable:n(ov.indexable),respMs:n(ov.avg_response_ms),
    labels:H.map(h=>shortDate(h.date)),
    hist:{critical:H.map(h=>n(h.critical)||0),warning:H.map(h=>n(h.warning)||0),opportunity:H.map(h=>n(h.opportunity)||0)},
    status:SC.filter(s=>n(st[s[1]])!=null).map(s=>[s[0],st[s[1]],s[2]]),
    index:IX.filter(s=>n(ix[s[1]])!=null).map(s=>[s[0],ix[s[1]],s[2]]),
    depth:DP.filter(d=>n(dp[d[1]])!=null).map(d=>[d[0],dp[d[1]]]),
    issues:j.issues.map(i=>({n:esc(i.fa||i.name||'بدون نام'),l:(i.level==='critical'||i.level==='opportunity')?i.level:'warning',
      u:n(i.urls)||0,d:n(i.delta),g:esc(i.guide||''),pct:n(i.percent)})),
  };
  CMETA={is_sample:!!m.is_sample,source:esc(m.source||'Screaming Frog'),crawl_date:esc(m.crawl_date||''),
    notes:(Array.isArray(m.notes)?m.notes:[]).map(esc)};
  return true;
}

    <div class="stat"><span class="l">میانگین زمان پاسخ</span><span class="v">${crawl.respMs==null?nd:`<span dir="ltr">${fa(crawl.respMs)} ms</span>`}</span></div>
  </div></div>

  <div class="grid g2">

      ${(crawl.status||[]).length?`<p class="hint">کد پاسخ سرور</p>${stk(crawl.status)}`:'<p class="hint" style="margin:0!important">کد پاسخ صفحات در Crawl Overview نبود.</p>'}
      ${(crawl.index||[]).length?`<p class="hint" style="margin:22px 0 10px!important">قابلیت ایندکس</p>${stk(crawl.index)}`:''}</div>
    <div class="card"><h3>عمق کراول</h3><p class="hint">چند کلیک از صفحهٔ اصلی فاصله دارند؛ بیشتر از ۳ کلیک برای صفحات مهم زیاد است</p>
      ${(crawl.depth||[]).length?`<div class="brs">${crawl.depth.map(d=>`<div class="br"><span>${d[0]} کلیک</span><span class="tr"><i style="width:${d[1]/dmax*100}%;background:${d[0]==='۴'||d[0]==='۵+'?'var(--warn)':'var(--accent)'}"></i></span><span class="nv">${fa(d[1])}</span></div>`).join('')}</div>`
        :'<p class="hint" style="margin:0!important">تعداد URL در هر عمق در Crawl Overview نبود.</p>'}</div>
  </div>
  <div class="card"><h3>فهرست خطاها</h3><p class="hint">به ترتیب سطح و تعداد URL · ${fa((crawl.issues||[]).length)} خطا</p><div class="filters" id="lf"></div><div class="tw"><table id="it"></table></div></div>`;
  if(hasTrend){
    const draw=()=>{document.getElementById('cchart').innerHTML=lineChart({series,labels:L,min:0,max:cmax,fmt:v=>fa(Math.round(v))});};
    draw();bindLegend('cleg',series,()=>{draw();document.querySelectorAll('#cleg button').forEach((b,i)=>b.classList.toggle('off',!!series[i].hidden));});
  }
  let lv='all';
  const tbl=()=>{
    document.getElementById('lf').innerHTML=[['all','همه']].concat(Object.entries(LVL).map(([k,v])=>[k,v[1]]))
      .filter(([k])=>k==='all'||(crawl.issues||[]).some(i=>i.l===k))
      .map(([k,l])=>`<button type="button" class="fbtn ${lv===k?'on':''}" data-l="${k}">${l}</button>`).join('');

    const ord={critical:0,warning:1,opportunity:2};
